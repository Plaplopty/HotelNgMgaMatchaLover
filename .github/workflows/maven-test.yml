name: Maven tests

on:
  pull_request:
    paths:
      - "mtchlvr-hotel-final/mtchlvr-hotel/**"
      - ".github/workflows/maven-test.yml"
  push:
    branches: [main]
    paths:
      - "mtchlvr-hotel-final/mtchlvr-hotel/**"
      - ".github/workflows/maven-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mtchlvr-hotel-final/mtchlvr-hotel/pom.xml
      - name: Run tests
        working-directory: mtchlvr-hotel-final/mtchlvr-hotel
        run: mvn --batch-mode --no-transfer-progress test
