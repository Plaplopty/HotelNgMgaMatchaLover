<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My reservations · mtchlvr hotel</title><link rel="stylesheet" href="/css/style.css"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap"><div th:replace="~{fragments :: alerts}"></div><span class="eyebrow">YOUR STAYS</span><h1 class="page-title">Your reservations.</h1><p class="lead">All the details of your time with us, in one place.</p><div th:if="${#lists.isEmpty(reservations)}" class="empty-state"><h2>Nothing booked just yet.</h2><p>Your next restful stay is waiting.</p><a class="button" href="/rooms">Browse rooms ↗</a></div><div class="table-wrap" th:unless="${#lists.isEmpty(reservations)}"><table><thead><tr><th>Room</th><th>Dates</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="r : ${reservations}"><td><strong th:text="${r.room.type} + ' · ' + ${r.room.roomNumber}">Deluxe · 201</strong></td><td th:text="${r.checkIn} + ' → ' + ${r.checkOut}">2026-10-14</td><td><span class="status" th:text="${r.status}" th:classappend="${r.status.toLowerCase()}">PENDING</span></td><td><form th:if="${r.status == 'PENDING' or r.status == 'APPROVED'}" th:action="@{'/customer/reservations/' + ${r.id} + '/cancel'}" method="post" onsubmit="return confirm('Request cancellation for this reservation?')"><button class="table-action" type="submit">Request cancellation</button></form><span th:unless="${r.status == 'PENDING' or r.status == 'APPROVED'}" class="muted">—</span></td></tr></tbody></table></div></main><footer><a class="brand" href="/"><span class="brand-mark">m</span><span>mtchlvr <small>HOTEL</small></span></a><span>© 2026 mtchlvr hotel</span></footer><script src="/js/app.js"></script><div th:replace="~{fragments :: chatbot}"></div></body></html>
